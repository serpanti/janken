# Match the native encoding used by Java @argfiles (Gradle #30304 on Windows).
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=COMPAT
# Avoid Kotlin daemon/fallback argument-file escaping of Unicode Windows paths.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.js.yarn=false
android.overridePathCheck=true
